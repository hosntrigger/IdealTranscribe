name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source
        working-directory: windows
        run: python -m py_compile ideal_transcribe.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Build EXE
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name IdealTranscribe --icon "assets\idealtranscribe_icon.ico" --add-data "assets;assets" --collect-all tkinterdnd2 ideal_transcribe.py

      - uses: actions/upload-artifact@v4
        with:
          name: IdealTranscribe-Windows
          path: windows/dist/IdealTranscribe.exe
